services:
  - type: web
    name: moodring
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # PUBLIC_URL is optional. If unset, URLs are derived from the request host
      # (e.g. https://<your-service>.onrender.com). Set it only for a custom domain.
      - key: PUBLIC_URL
        sync: false
      - key: RECEIVE_ADDRESS
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false
    autoDeploy: true
