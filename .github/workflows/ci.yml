name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests (mood engine)
        run: npm test
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:10000/health && break
            sleep 1
          done
        env:
          PORT: 10000
          # Smoke test expects https endpoints in the manifest.
          PUBLIC_URL: https://moodring.ci.example
          RECEIVE_ADDRESS: '0x0000000000000000000000000000000000000001'
      - name: Smoke test (all endpoints)
        run: npm run smoke
      - name: Server log
        if: always()
        run: cat server.log || true
